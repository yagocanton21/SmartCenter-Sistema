services:
  smartcenter:
    build: .
    container_name: smartcenter-app
    restart: unless-stopped
    ports:
      - "${PORT:-8093}:3000"
    volumes:
      - smartcenter-data:/app/data
    environment:
      - TZ=America/Sao_Paulo
      - PORT=3000
      - DB_PATH=/app/data/smartcenter.db
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    deploy:
      resources:
        limits:
          memory: 350M

volumes:
  smartcenter-data:
    name: smartcenter-data
