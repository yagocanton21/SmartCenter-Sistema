name: CI/CD Pipeline

concurrency:
  group: smartcenter-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Executar Testes Automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar testes de concorrência e idempotência
        run: npm test

      - name: Validar imagem, API e persistência Docker
        run: |
          docker build -t smartcenter-ci .
          docker volume create smartcenter-ci-data
          docker run -d --name smartcenter-ci --mount source=smartcenter-ci-data,target=/app/data -e INITIAL_ADMIN_PASSWORD=ci-initial-password smartcenter-ci
          for attempt in $(seq 1 30); do
            if docker exec smartcenter-ci node -e "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"; then break; fi
            sleep 1
          done
          docker exec smartcenter-ci node -e "const {DatabaseSync}=require('node:sqlite');const d=new DatabaseSync(process.env.DB_PATH);d.prepare('INSERT OR REPLACE INTO config(key,value) VALUES(?,?)').run('ci_marker','true')"
          docker rm -f smartcenter-ci
          docker run -d --name smartcenter-ci --mount source=smartcenter-ci-data,target=/app/data smartcenter-ci
          for attempt in $(seq 1 30); do
            if docker exec smartcenter-ci node -e "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"; then break; fi
            sleep 1
          done
          docker exec smartcenter-ci node -e "const {DatabaseSync}=require('node:sqlite');const d=new DatabaseSync(process.env.DB_PATH);if(d.prepare('SELECT value FROM config WHERE key=?').get('ci_marker').value!=='true')process.exit(1)"
          docker exec smartcenter-ci node -e "Promise.all([['/api/db',401],['/smartcenter.db',404],['/server.js',404]].map(async([p,s])=>{if((await fetch('http://127.0.0.1:3000'+p)).status!==s)process.exit(1)})).catch(()=>process.exit(1))"

  deploy:
    name: 🚀 Deploy Automático na VPS3
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH na VPS3
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/home/ubuntu/smartcenter-sistema"

            if [ ! -d "$APP_DIR" ]; then
              echo "Clonando repositório na VPS3..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
              cd "$APP_DIR"
            else
              echo "Atualizando repositório na VPS3..."
              cd "$APP_DIR"
              git fetch --all
              git reset --hard origin/main
            fi

            sh scripts/deploy.sh

